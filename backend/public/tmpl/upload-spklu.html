<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NHKorindo Cafe - Dashboard - Upload SPKLU</title>
    <link rel="stylesheet" href="{{.BaseURL}}/view/mvp.css">
    <link rel="stylesheet" href="{{.BaseURL}}/view/style.css">
    <style>
        label {
            width: 90px;
        }

        input {
            width: 313px;
        }

        form {
            margin-top: 1rem;
        }
    </style>
</head>
<body>
<header>
    <nav>
        <ul>
            <li><a href="{{.BaseURL}}/page/upload-csv">Upload CSV</a></li>
            <li><a href="{{.BaseURL}}/page/upload-spklu">Upload SPKLU</a></li>
            <li><a href="{{.BaseURL}}/page/upload-approval">Approve Uploads</a></li>
            <li><a href="{{.BaseURL}}/page/assign-referral">Assign Referral</a></li>
            <li><a href="{{.BaseURL}}/page/add-payment">Add Payment</a></li>
            <li><a href="{{.BaseURL}}/page/multi-transaction">Multi Transaction</a></li>
            <li><a href="{{.BaseURL}}/page/referral-tree">Referral Tree</a></li>
        </ul>
    </nav>
</header>
<main>
    <section>
        <form id="form" action="{{.BaseURL}}/v1/upload-spklu" enctype="multipart/form-data">
            <div>
                <label for="file">File:</label>
                <input type="file" id="file" name="file" accept=".xlsx"/>
            </div>
            <div class="text-center">
                <button>Submit</button>
            </div>
        </form>
    </section>
</main>
<script>
    let form = document.querySelector("#form");
    form.onsubmit = async (e) => {
        e.preventDefault();

        const form = e.currentTarget;
        const url = form.action;

        try {
            const formData = new FormData(form);
            const response = await fetch(url, {
                method: 'POST',
                body: formData
            });
            const result = await response.json();

            window.alert(`${response.status} - ${result.message}`);
        } catch (error) {
            window.alert(error);
        }
    }
</script>
</body>
</html>
